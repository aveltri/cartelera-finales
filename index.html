<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F7F4FB">
<title>Cartelera de Finales</title>
<meta name="description" content="Finales nov/dic 2026 – Lic. en Psicología, 1° año, Turno Mañana">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
  :root {
    color-scheme: light;
    --bg: #F7F4FB;          /* fondo: blanco lavanda muy suave */
    --text: #3b2f55;
    --muted: #958bab;
    --line: #e7e0f0;
    --lav: #e6dcf7;
    --lav-ink: #5f4a9e;
    --pink-soft: #fbdbe8;
    --pink-hot: #E8407F;    /* rosa intenso */
    --pink-ink: #b8235c;
  }
  * { box-sizing: border-box; }
  html { background: #F7F4FB; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 1.7rem; color: var(--lav-ink); }
  header p { margin: 0; color: var(--muted); }

  /* Próximo final */
  .next {
    margin: 28px 0 8px;
    padding: 6px 0 6px 16px;
    border-left: 5px solid var(--pink-hot);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .next small { color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-size: .75rem; }
  .next strong { display: block; font-size: 1.25rem; margin: 2px 0; }
  .next .when { color: var(--muted); }
  .next .big { font-size: 2rem; font-weight: 800; color: var(--pink-hot); text-align: right; white-space: nowrap; line-height: 1.1; }

  /* Semanas */
  section.week { margin-top: 32px; }
  section.week h2 {
    font-size: 1rem;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 12px;
  }

  .days { display: inline-flex; gap: 4px; margin-left: auto; }
  .days span {
    width: 18px; height: 18px;
    border-radius: 4px;
    border: 1.5px solid var(--lav);
    background: transparent;
    font-size: .6rem;
    font-weight: 700;
    color: var(--muted);
    display: grid;
    place-items: center;
  }
  .days span.on { background: var(--pink-hot); border-color: var(--pink-hot); color: #fff; }

  ul { list-style: none; margin: 0; padding: 0; }
  li.exam {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .date { text-align: center; line-height: 1.1; }
  .date .dow, .date .mon { font-size: .72rem; text-transform: uppercase; color: var(--muted); }
  .date .day { font-size: 1.4rem; font-weight: 700; color: var(--lav-ink); }
  .info .name { font-weight: 600; }
  .info .meta { color: var(--muted); font-size: .85rem; }
  .left {
    font-weight: 600;
    white-space: nowrap;
    font-size: .85rem;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--lav);
    color: var(--lav-ink);
  }
  .left.soon { background: var(--pink-soft); color: var(--pink-ink); }
  .left.today { background: var(--pink-hot); color: #fff; }

  footer { margin-top: 40px; color: var(--muted); font-size: .8rem; }

  @media (max-width: 480px) {
    .next .big { font-size: 1.5rem; }
    li.exam { grid-template-columns: 52px 1fr; }
    .left { grid-column: 2; justify-self: start; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>📚 Cartelera de Finales</h1>
    <p>Lic. en Psicología · 1° año · Turno Mañana · Nov / Dic 2026</p>
  </header>

  <div class="next" id="next"></div>

  <div id="weeks"></div>

  <footer>Fuente: Cronograma de exámenes finales nov/dic 2026, Universidad Favaloro. Los días se calculan con la hora de Argentina.</footer>
</main>

<script>
// Finales de 1° año a rendir.
const EXAMS = [
  { date: "2026-11-26", time: "8:00",  name: "Neurociencias" },
  { date: "2026-12-01", time: "11:00", name: "Procesos Básicos I" },
  { date: "2026-12-04", time: "12:00", name: "Epistemología" },
  { date: "2026-12-09", time: "8:00",  name: "Metodología de la Investigación Psicológica" },
  { date: "2026-12-14", time: "10:00", name: "Sociología" },
  { date: "2026-12-15", time: "9:00",  name: "Inglés Científico" },
  { date: "2026-12-18", time: "9:00",  name: "Proyecto de Lectura, Escritura y Oralidad Académicas" },
];

const DOW = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const MON = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const WEEKDAY_LETTERS = ["L", "M", "M", "J", "V"];
const MS_DAY = 86400000;
// Lunes de la "semana 1" del período de finales.
const PERIOD_START = "2026-11-23";

// Fecha de hoy en Argentina, como "días desde epoch".
function todayAR() {
  const s = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Argentina/Buenos_Aires" }).format(new Date());
  return dayNum(s);
}
function dayNum(iso) { return Math.round(Date.parse(iso + "T00:00:00Z") / MS_DAY); }
function fromDayNum(n) { return new Date(n * MS_DAY); }
function mondayOf(n) { const dow = fromDayNum(n).getUTCDay(); return n - ((dow + 6) % 7); }
function fmt(n) { const d = fromDayNum(n); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; }

// "23 al 27 nov" o "30 nov al 4 dic"
function rangeLabel(m) {
  const a = fromDayNum(m), b = fromDayNum(m + 4);
  return a.getUTCMonth() === b.getUTCMonth()
    ? `${a.getUTCDate()} al ${fmt(m + 4)}`
    : `${fmt(m)} al ${fmt(m + 4)}`;
}

function leftLabel(diff) {
  if (diff === 0) return { text: "¡Hoy!", cls: "today" };
  if (diff === 1) return { text: "Mañana", cls: "today" };
  return { text: `Faltan ${diff} días`, cls: diff <= 7 ? "soon" : "" };
}

function render() {
  const today = todayAR();
  const exams = EXAMS
    .map(e => ({ ...e, day: dayNum(e.date) }))
    .map(e => ({ ...e, diff: e.day - today }))
    .filter(e => e.diff >= 0)
    .sort((a, b) => a.day - b.day || a.time.localeCompare(b.time, undefined, { numeric: true }));

  // Próximo final
  const nextEl = document.getElementById("next");
  const upcoming = exams[0];
  if (upcoming) {
    const l = leftLabel(upcoming.diff);
    nextEl.innerHTML = `
      <div>
        <small>Próximo final</small>
        <strong>${upcoming.name}</strong>
        <div class="when">${DOW[fromDayNum(upcoming.day).getUTCDay()]} ${fmt(upcoming.day)} · ${upcoming.time} hs</div>
      </div>
      <div class="big">${l.text}</div>`;
  } else {
    nextEl.innerHTML = `<strong>No quedan finales por rendir 🎉</strong>`;
  }

  // Agrupar por semana (lunes a viernes)
  const weeks = new Map();
  for (const e of exams) {
    const m = mondayOf(e.day);
    if (!weeks.has(m)) weeks.set(m, []);
    weeks.get(m).push(e);
  }

  const container = document.getElementById("weeks");
  container.innerHTML = "";
  const firstMonday = mondayOf(dayNum(PERIOD_START));
  for (const [m, list] of weeks) {
    const weekNo = Math.round((m - firstMonday) / 7) + 1;
    const examDays = new Set(list.map(e => e.day - m));
    const squares = WEEKDAY_LETTERS
      .map((letter, i) => `<span class="${examDays.has(i) ? "on" : ""}" title="${DOW[(i + 1) % 7]} ${fmt(m + i)}">${letter}</span>`)
      .join("");
    const sec = document.createElement("section");
    sec.className = "week";
    sec.innerHTML = `<h2>Semana ${weekNo}: ${rangeLabel(m)} <span class="days">${squares}</span></h2><ul></ul>`;
    const ul = sec.querySelector("ul");
    for (const e of list) {
      const d = fromDayNum(e.day);
      const l = leftLabel(e.diff);
      const li = document.createElement("li");
      li.className = "exam";
      li.innerHTML = `
        <div class="date"><div class="dow">${DOW[d.getUTCDay()]}</div><div class="day">${d.getUTCDate()}</div><div class="mon">${MON[d.getUTCMonth()]}</div></div>
        <div class="info"><div class="name">${e.name}</div><div class="meta">${e.time} hs</div></div>
        <div class="left ${l.cls}">${l.text}</div>`;
      ul.appendChild(li);
    }
    container.appendChild(sec);
  }
}

render();
// Recalcular cada hora por si la página queda abierta.
setInterval(render, 3600000);
</script>
</body>
</html>
